name: default
version: "0.2.0"

# SpecCraft 默认 Workflow（声明式，见 ADR 0002 §7 / ADR 0003 §3）
# 16 阶段；gate.type 取值：all_required_completed | owner_approval
# auto_complete: true 表示 gate 满足时自动级联完成（缺省 false）。
# implementation / owner-acceptance 必须显式推进，故保持缺省。

stages:
  - id: idea
    requires: []
    produces: [idea]
    skill: discovery
    template: idea
    gate: { type: all_required_completed }

  - id: feasibility
    requires: [idea]
    produces: [feasibility]
    template: feasibility
    gate: { type: all_required_completed }

  - id: discovery
    requires: [feasibility]
    produces: [discovery]
    skill: discovery
    template: discovery
    gate: { type: all_required_completed }

  - id: requirement
    requires: [discovery]
    produces: [requirements]
    template: requirements
    gate: { type: all_required_completed }

  - id: concept
    requires: [requirement]
    produces: [concept]
    template: concept
    gate: { type: all_required_completed }

  - id: research
    requires: [concept]
    produces: [research]
    skill: research
    template: research
    gate: { type: all_required_completed }

  - id: design
    requires: [requirement, research]
    produces: [design]
    skill: design
    template: design
    gate: { type: all_required_completed }

  - id: owner-approval
    requires: [design]
    produces: []
    auto_complete: true
    gate: { type: owner_approval }

  - id: build-brief
    requires: [owner-approval]
    produces: [build-brief]
    skill: build-brief
    template: build-brief
    gate: { type: all_required_completed }

  - id: site-survey
    requires: [build-brief]
    produces: [site-survey]
    skill: site-survey
    template: site-survey
    gate: { type: all_required_completed }

  - id: execution-manual
    requires: [build-brief, site-survey]
    produces: [execution-manual]
    skill: execution-manual
    template: execution-manual
    gate: { type: all_required_completed }

  - id: ready-to-implement
    requires: [execution-manual]
    produces: []
    auto_complete: true
    gate: { type: all_required_completed }

  - id: implementation
    requires: [ready-to-implement]
    produces: []
    # 不声明 auto_complete：必须由 `speccraft implement start` 显式开始，
    # 并由 `speccraft implement finish --report <path>` 显式结束。
    gate: { type: all_required_completed }

  - id: verification
    requires: [implementation]
    produces: [verification]
    skill: verification
    template: verification
    gate: { type: all_required_completed }

  - id: owner-acceptance
    requires: [verification]
    produces: []
    gate: { type: owner_approval }

  - id: handoff
    requires: [owner-acceptance]
    produces: [handoff]
    template: handoff
    gate: { type: all_required_completed }
